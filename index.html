<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTX Terminal | Real-Time</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1f1f1f;
            --text-main: #ededed;
            --text-muted: #a1a1a1;
            --accent: #ffffff;
            --green: #22c55e;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - Coin List */
        .sidebar {
            width: 350px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .search-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .coin-list {
            flex: 1;
            overflow-y: auto;
        }

        .coin-item {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
        }

        .coin-item:hover {
            background: var(--surface);
        }

        .coin-info b { font-size: 14px; letter-spacing: 0.5px; }
        .coin-info span { font-size: 12px; color: var(--text-muted); display: block; }

        /* Main Content - Price Display */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .price-wrapper {
            text-align: center;
        }

        .symbol-badge {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .big-price {
            font-size: 80px;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 0;
            transition: color 0.1s;
        }

        /* Status colors - No Glow */
        .price-up { color: var(--green) !important; }
        .price-down { color: var(--red) !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loader" class="loader-overlay">
        <p style="font-size: 14px; color: var(--text-muted);">Syncing with HTX Mainframe...</p>
    </div>

    <div class="sidebar">
        <div class="search-container">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
                <i data-lucide="layout-grid" style="width: 18px; color: var(--text-muted);"></i>
                <span style="font-weight: 600; font-size: 14px;">MARKETS</span>
            </div>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search 1000+ coins...">
        </div>
        <div id="coinList" class="coin-list">
            </div>
    </div>

    <div class="main-content">
        <div class="price-wrapper">
            <div class="symbol-badge">
                <i data-lucide="activity" style="width: 14px;"></i>
                <span id="activeSymText">Select a pair</span>
            </div>
            <h1 id="priceDisplay" class="big-price">0.00</h1>
            <p id="pairSubtitle" style="color: var(--text-muted); font-size: 14px; margin-top: 10px;">Waiting for data stream</p>
        </div>
    </div>

    <script>
        const coinListEl = document.getElementById('coinList');
        const searchInput = document.getElementById('searchInput');
        const priceDisplay = document.getElementById('priceDisplay');
        const activeSymText = document.getElementById('activeSymText');
        const loader = document.getElementById('loader');

        let allCoins = [];
        let ws;

        // 1. Fetch all coins using HTX Ticker (Sab ke sab jo support hote hain)
        async function fetchMarkets() {
            try {
                const response = await fetch('https://api.huobi.pro/market/tickers');
                const result = await response.json();
                
                // Hum sirf USDT pairs filter karenge
                allCoins = result.data.filter(c => c.symbol.endsWith('usdt'));
                
                renderCoins(allCoins);
                loader.style.display = 'none';
                
                // Default start with BTC
                subscribe('btcusdt');
                lucide.createIcons(); // Initialize icons
            } catch (err) {
                console.error("API Error", err);
                document.querySelector('#loader p').innerText = "CORS Error. Use a proxy or local server.";
            }
        }

        // 2. Render List
        function renderCoins(list) {
            coinListEl.innerHTML = '';
            list.forEach(coin => {
                const base = coin.symbol.replace('usdt', '').toUpperCase();
                const div = document.createElement('div');
                div.className = 'coin-item';
                div.innerHTML = `
                    <div class="coin-info">
                        <b>${base}</b>
                        <span>HTX / USDT</span>
                    </div>
                    <i data-lucide="chevron-right" style="width:14px; color:#333;"></i>
                `;
                div.onclick = () => subscribe(coin.symbol);
                coinListEl.appendChild(div);
            });
            lucide.createIcons();
        }

        // 3. Search Logic
        searchInput.oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allCoins.filter(c => c.symbol.includes(val));
            renderCoins(filtered);
        };

        // 4. WebSocket Subscription
        function subscribe(symbol) {
            if (ws) ws.close();
            
            activeSymText.innerText = symbol.toUpperCase();
            priceDisplay.innerText = "---";
            priceDisplay.className = "big-price";

            ws = new WebSocket("wss://api.huobi.pro/ws");
            let prevPrice = 0;

            ws.onopen = () => {
                ws.send(JSON.stringify({ "sub": `market.${symbol}.detail`, "id": "sub1" }));
            };

            ws.onmessage = (event) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const data = JSON.parse(pako.ungzip(new Uint8Array(reader.result), { to: 'string' }));
                    
                    if (data.ping) ws.send(JSON.stringify({ pong: data.ping }));

                    if (data.tick) {
                        const price = data.tick.close;
                        const formatted = price < 1 ? price.toFixed(6) : price.toLocaleString(undefined, {minimumFractionDigits: 2});
                        
                        priceDisplay.innerText = formatted;

                        // Next.js style color flashing
                        if (price > prevPrice) {
                            priceDisplay.classList.add('price-up');
                            priceDisplay.classList.remove('price-down');
                        } else if (price < prevPrice) {
                            priceDisplay.classList.add('price-down');
                            priceDisplay.classList.remove('price-up');
                        }
                        
                        prevPrice = price;
                    }
                };
                reader.readAsArrayBuffer(event.data);
            };
        }

        fetchMarkets();
    </script>
</body>
</html>
