<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTX Elite | Institutional Terminal</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --sidebar: #09090b;
            --card: #0c0c0e;
            --border: #1f1f23;
            --accent: #ffffff;
            --muted: #a1a1aa;
            --green: #10b981;
            --red: #ef4444;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            background: var(--bg); 
            color: var(--accent); 
            font-family: var(--font-main); 
            margin: 0; 
            height: 100vh; 
            overflow: hidden;
            display: flex;
        }

        /* Mobile Blocker */
        #mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 1024px) {
            #mobile-overlay { display: flex; }
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 24px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .search-area { padding: 16px; }
        .search-input {
            width: 100%;
            background: #141416;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 12px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .market-list {
            flex: 1;
            overflow-y: auto;
        }

        .market-item {
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #0f0f11;
            transition: background 0.2s ease;
        }

        .market-item:hover { background: #141416; }
        .market-item span { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

        /* Main Viewport */
        .viewport { flex: 1; display: flex; flex-direction: column; }

        .top-nav {
            height: 64px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }

        .live-info { display: flex; align-items: baseline; gap: 16px; }
        #target-sym { font-weight: 700; font-size: 18px; }
        #live-price { font-family: var(--font-mono); font-size: 24px; font-weight: 700; }

        .metrics { display: flex; gap: 40px; }
        .metric-group { display: flex; flex-direction: column; }
        .metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .metric-value { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }

        /* Chart Wrapper */
        .chart-frame {
            flex: 1;
            background: #000;
            padding: 8px;
        }

        #tv_container {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Utilities */
        .up { color: var(--green); }
        .down { color: var(--red); }
        
        .pulse {
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

    <div id="mobile-overlay">
        <i data-lucide="monitor" style="width: 48px; height: 48px; margin-bottom: 20px;"></i>
        <h2 style="font-weight: 600;">Desktop Access Only</h2>
        <p style="color: var(--muted); font-size: 14px; max-width: 250px;">Elite Terminal Pro requires a wider viewport for professional analysis. Please switch to a desktop browser.</p>
    </div>

    <aside class="sidebar">
        <div class="brand">
            <div class="pulse"></div> HTX ELITE PRO
        </div>
        <div class="search-area">
            <input type="text" id="search" class="search-input" placeholder="Search markets...">
        </div>
        <div id="market-list" class="market-list"></div>
    </aside>

    <main class="viewport">
        <header class="top-nav">
            <div class="live-info">
                <span id="target-sym">BTC/USDT</span>
                <span id="live-price">---</span>
            </div>
            
            <div class="metrics">
                <div class="metric-group">
                    <span class="metric-label">24h Change</span>
                    <span id="pc" class="metric-value">--</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">24h High</span>
                    <span id="ph" class="metric-value">--</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">24h Low</span>
                    <span id="pl" class="metric-value">--</span>
                </div>
            </div>
        </header>

        <section class="chart-frame">
            <div id="tv_container"></div>
        </section>
    </main>

    <script>
        const marketList = document.getElementById('market-list');
        const priceEl = document.getElementById('live-price');
        let allMarkets = [];
        let socket;

        function initChart(symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": `HUOBI:${symbol.toUpperCase()}`,
                "interval": "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tv_container",
                "backgroundColor": "#000000",
                "gridColor": "rgba(42, 46, 57, 0.06)",
                "details": false,
                "hotlist": false,
                "calendar": false,
                "show_popup_button": true,
                "popup_width": "1000",
                "popup_height": "650"
            });
        }

        // Fetch initial market data
        const bootSocket = new WebSocket("wss://api.huobi.pro/ws");
        bootSocket.onopen = () => bootSocket.send(JSON.stringify({ "sub": "market.tickers", "id": "init" }));
        bootSocket.onmessage = async (e) => {
            const text = pako.ungzip(await e.data.arrayBuffer(), { to: 'string' });
            const res = JSON.parse(text);
            
            if (res.data && allMarkets.length === 0) {
                allMarkets = res.data.filter(x => x.symbol.endsWith('usdt'));
                renderMarkets(allMarkets);
                switchMarket('btcusdt');
                bootSocket.close();
            }
        };

        function renderMarkets(data) {
            marketList.innerHTML = '';
            data.slice(0, 100).forEach(m => {
                const row = document.createElement('div');
                row.className = 'market-item';
                const base = m.symbol.replace('usdt', '').toUpperCase();
                row.innerHTML = `<span>${base}</span><span style="color:var(--muted)">USDT</span>`;
                row.onclick = () => switchMarket(m.symbol);
                marketList.appendChild(row);
            });
        }

        async function switchMarket(sym) {
            if (socket) socket.close();
            document.getElementById('target-sym').innerText = sym.toUpperCase();
            initChart(sym);

            socket = new WebSocket("wss://api.huobi.pro/ws");
            let lastPrice = 0;

            socket.onopen = () => socket.send(JSON.stringify({ "sub": `market.${sym}.detail`, "id": "detail" }));
            socket.onmessage = async (e) => {
                const text = pako.ungzip(await e.data.arrayBuffer(), { to: 'string' });
                const data = JSON.parse(text);

                if (data.ping) socket.send(JSON.stringify({ pong: data.ping }));
                if (data.tick) {
                    const t = data.tick;
                    priceEl.innerText = t.close.toFixed(2);
                    priceEl.className = t.close >= lastPrice ? 'up' : 'down';
                    
                    const change = ((t.close - t.open) / t.open * 100).toFixed(2);
                    document.getElementById('pc').innerText = `${change > 0 ? '+' : ''}${change}%`;
                    document.getElementById('pc').className = `metric-value ${change >= 0 ? 'up' : 'down'}`;
                    document.getElementById('ph').innerText = t.high.toFixed(2);
                    document.getElementById('pl').innerText = t.low.toFixed(2);
                    
                    lastPrice = t.close;
                }
            };
        }

        document.getElementById('search').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            renderMarkets(allMarkets.filter(p => p.symbol.includes(val)));
        };

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
