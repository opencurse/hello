<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTX Pro Terminal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --surface: #0a0a0a; --border: #1a1a1a; --text: #fff; --muted: #888; --green: #10b981; --red: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; flex-direction: row; }

        /* Sidebar - PC par side mein, Mobile par niche */
        .sidebar { width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg); z-index: 100; flex-shrink: 0; }
        .search-box { padding: 15px; border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .coin-list { flex: 1; overflow-y: auto; }
        .coin-item { padding: 12px 20px; border-bottom: 1px solid #0d0d0d; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .coin-item:active { background: #111; }

        /* Main Section */
        .main { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
        .header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
        .price-section { display: flex; flex-direction: column; }
        .sym { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .price { font-family: 'Geist Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 4px; }
        
        .stats-grid { display: flex; gap: 15px; text-align: right; }
        .stat-item span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; }
        .stat-item b { font-size: 12px; }

        /* Chart Area */
        .chart-container { flex: 1; background: #000; position: relative; }

        /* Responsive Logic */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-right: none; border-top: 1px solid var(--border); }
            .main { height: 60%; }
            .header { padding: 10px 15px; }
            .price { font-size: 20px; }
            .stats-grid { gap: 10px; }
            .stat-item b { font-size: 11px; }
            .sidebar-hide { display: none; } /* Mobile par faltu chize hide karne ke liye */
        }

        .up { color: var(--green); }
        .down { color: var(--red); }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>
</head>
<body>

    <div class="main">
        <div class="header">
            <div class="price-section">
                <div class="sym" id="target-sym">BTC/USDT</div>
                <div class="price" id="live-price">--</div>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><span>24h %</span><b id="pc">--</b></div>
                <div class="stat-item sidebar-hide"><span>High</span><b id="ph">--</b></div>
                <div class="stat-item"><span>Low</span><b id="pl">--</b></div>
            </div>
        </div>
        <div class="chart-container">
            <div id="tv-chart" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="search-box">
            <input type="text" id="search" class="search-input" placeholder="Search Markets...">
        </div>
        <div id="coin-list" class="coin-list"></div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let allCoins = [];
        let priceWs;
        const priceEl = document.getElementById('live-price');
        const targetEl = document.getElementById('target-sym');
        const listEl = document.getElementById('coin-list');

        // 1. WebSocket for Tickers (No CORS)
        const listWs = new WebSocket("wss://api.huobi.pro/ws");
        listWs.onopen = () => listWs.send(JSON.stringify({ "sub": "market.tickers", "id": "list" }));
        listWs.onmessage = (e) => {
            const reader = new FileReader();
            reader.onload = () => {
                const res = JSON.parse(pako.ungzip(new Uint8Array(reader.result), { to: 'string' }));
                if (res.data && allCoins.length === 0) {
                    allCoins = res.data.filter(x => x.symbol.endsWith('usdt'));
                    renderList(allCoins);
                    switchCoin('btcusdt');
                    listWs.close();
                }
            };
            reader.readAsArrayBuffer(e.data);
        };

        function renderList(data) {
            listEl.innerHTML = '';
            data.forEach(c => {
                const row = document.createElement('div');
                row.className = 'coin-item';
                row.innerHTML = `<b>${c.symbol.replace('usdt','').toUpperCase()}</b><i data-lucide="chevron-right" style="width:14px;color:#222"></i>`;
                row.onclick = () => {
                    switchCoin(c.symbol);
                    if(window.innerWidth <= 768) window.scrollTo(0,0);
                };
                listEl.appendChild(row);
            });
            lucide.createIcons();
        }

        document.getElementById('search').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            renderList(allCoins.filter(p => p.symbol.includes(val)));
        };

        function switchCoin(sym) {
            if (priceWs) priceWs.close();
            targetEl.innerText = sym.toUpperCase();
            
            // TradingView Widget Responsive
            new TradingView.widget({
                "autosize": true,
                "symbol": `HUOBI:${sym.toUpperCase()}`,
                "interval": "60",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "container_id": "tv-chart",
                "hide_top_toolbar": window.innerWidth < 768,
                "hide_legend": window.innerWidth < 768,
                "backgroundColor": "#000000",
                "gridColor": "#111111"
            });

            priceWs = new WebSocket("wss://api.huobi.pro/ws");
            let lastP = 0;
            priceWs.onopen = () => priceWs.send(JSON.stringify({ "sub": `market.${sym}.detail`, "id": "p" }));
            priceWs.onmessage = (e) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const d = JSON.parse(pako.ungzip(new Uint8Array(reader.result), { to: 'string' }));
                    if (d.tick) {
                        const t = d.tick;
                        priceEl.innerText = t.close.toLocaleString();
                        priceEl.className = `price ${t.close >= lastP ? 'up' : 'down'}`;
                        
                        const chg = ((t.close - t.open) / t.open * 100).toFixed(2);
                        document.getElementById('pc').innerText = `${chg}%`;
                        document.getElementById('pc').className = chg >= 0 ? 'up' : 'down';
                        document.getElementById('ph').innerText = t.high.toLocaleString();
                        document.getElementById('pl').innerText = t.low.toLocaleString();
                        lastP = t.close;
                    }
                };
                reader.readAsArrayBuffer(e.data);
            };
        }
    </script>
</body>
</html>
