<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTX Quantum Terminal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Glow */
        body::before {
            content: '';
            position: fixed;
            top: -10%; left: -10%;
            width: 40%; height: 40%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            margin-bottom: 5px;
        }

        .terminal-container {
            width: 90%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .search-box:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .live-monitor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 4px solid var(--neon-blue);
        }

        .active-symbol {
            font-size: 1.5rem;
            color: #888;
        }

        .active-symbol span {
            color: #fff;
            font-weight: bold;
            font-family: 'Orbitron';
        }

        .price-now {
            font-size: 4rem;
            font-family: 'Orbitron';
            transition: 0.2s;
        }

        .up { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); }
        .down { color: var(--neon-red); text-shadow: 0 0 20px var(--neon-red); }

        .coin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom Scrollbar */
        .coin-grid::-webkit-scrollbar { width: 5px; }
        .coin-grid::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        .coin-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .coin-card:hover {
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--neon-blue);
            transform: translateY(-3px);
        }

        .coin-card b { display: block; font-size: 1.1rem; margin-bottom: 5px; }
        .coin-card span { font-size: 0.8rem; color: #666; }

        .loader {
            color: var(--neon-blue);
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <h1>HTX Live Terminal</h1>
    <p style="color: #666; margin-bottom: 30px;">Direct WebSocket Feed • Zero Latency</p>

    <div class="terminal-container">
        
        <div class="live-monitor">
            <div class="active-symbol">TRACKING: <span id="cur-sym">BTC/USDT</span></div>
            <div id="price-display" class="price-now">---</div>
        </div>

        <div class="search-wrapper">
            <input type="text" id="search" class="search-box" placeholder="Search Assets (e.g. SOL, SHIB, PEPE)...">
        </div>

        <div id="coin-grid" class="coin-grid">
            <div class="loader">Accessing HTX Mainframe...</div>
        </div>
    </div>

    <script>
        const priceDisplay = document.getElementById('price-display');
        const symbolDisplay = document.getElementById('cur-sym');
        const coinGrid = document.getElementById('coin-grid');
        const searchInput = document.getElementById('search');

        let ws;
        let allPairs = [];

        // 1. Fetching Pairs with a fallback to avoid CORS error
        async function loadMarketData() {
            try {
                // HTX direct link (if CORS allows)
                const res = await fetch('https://api.huobi.pro/market/tickers');
                const json = await res.json();
                
                // Hum sirf USDT pairs nikalenge
                allPairs = json.data
                    .filter(item => item.symbol.endsWith('usdt'))
                    .map(item => item.symbol);
                
                renderList(allPairs);
                // By default BTC start karein
                startStreaming('btcusdt');
            } catch (e) {
                // Fallback list agar API fail ho jaye
                allPairs = ['btcusdt', 'ethusdt', 'solusdt', 'dogeusdt', 'adausdt', 'xrpusdt', 'dotusdt', 'shibusdt', 'pepeusdt', 'linkusdt'];
                renderList(allPairs);
                startStreaming('btcusdt');
            }
        }

        function renderList(list) {
            coinGrid.innerHTML = '';
            list.forEach(sym => {
                const base = sym.replace('usdt', '').toUpperCase();
                const card = document.createElement('div');
                card.className = 'coin-card';
                card.innerHTML = `<b>${base}</b><span>USDT</span>`;
                card.onclick = () => startStreaming(sym);
                coinGrid.appendChild(card);
            });
        }

        searchInput.oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allPairs.filter(s => s.includes(term));
            renderList(filtered);
        };

        function startStreaming(symbol) {
            if (ws) ws.close();

            symbolDisplay.innerText = `${symbol.replace('usdt', '').toUpperCase()} / USDT`;
            priceDisplay.innerText = "LOADING";
            priceDisplay.className = "price-now";

            ws = new WebSocket("wss://api.huobi.pro/ws");
            let lastPrice = 0;

            ws.onopen = () => {
                ws.send(JSON.stringify({ "sub": `market.${symbol}.detail`, "id": "req1" }));
            };

            ws.onmessage = (event) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const decoded = pako.ungzip(new Uint8Array(reader.result), { to: 'string' });
                    const data = JSON.parse(decoded);

                    if (data.ping) ws.send(JSON.stringify({ pong: data.ping }));

                    if (data.tick) {
                        const price = data.tick.close;
                        // Precision handling
                        const formattedPrice = price < 0.1 ? price.toFixed(8) : price.toLocaleString(undefined, {minimumFractionDigits: 2});
                        
                        priceDisplay.innerText = `$${formattedPrice}`;
                        
                        if (price > lastPrice) priceDisplay.className = "price-now up";
                        else if (price < lastPrice) priceDisplay.className = "price-now down";
                        
                        lastPrice = price;
                    }
                };
                reader.readAsArrayBuffer(event.data);
            };
        }

        loadMarketData();
    </script>
</body>
</html>
