<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTX Real-Time Crypto Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #181a20; --text: #eaecef; --primary: #f0b90b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .search-box { width: 100%; max-width: 400px; padding: 12px; border-radius: 8px; border: 1px solid #333; background: var(--card); color: white; margin-bottom: 20px; font-size: 16px; }

        .price-card { background: var(--card); padding: 30px; border-radius: 12px; text-align: center; min-width: 300px; border: 1px solid #2b2f36; }
        .symbol-title { font-size: 1.2rem; color: #848e9c; text-transform: uppercase; }
        .live-price { font-size: 3rem; font-weight: bold; margin: 10px 0; }
        
        .coin-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; width: 100%; max-width: 800px; max-height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #2b2f36; border-radius: 8px; }
        .coin-item { background: #2b2f36; padding: 8px; text-align: center; cursor: pointer; border-radius: 4px; font-size: 0.9rem; transition: 0.2s; }
        .coin-item:hover { background: var(--primary); color: black; }

        .up { color: #0ecb81; }
        .down { color: #f6465d; }
    </style>
</head>
<body>

    <div class="header">
        <h1>HTX Live Market</h1>
        <p>Select a coin to see live price via WebSocket</p>
    </div>

    <input type="text" id="search" class="search-box" placeholder="Search Coin (e.g. eth, sol, doge)...">

    <div class="price-card">
        <div id="current-symbol" class="symbol-title">SELECT A COIN</div>
        <div id="price-display" class="live-price">$0.00</div>
    </div>

    <h3 style="margin-top: 30px;">Available Coins</h3>
    <div id="coin-container" class="coin-list">Loading coins...</div>

    <script>
        const priceDisplay = document.getElementById('price-display');
        const symbolTitle = document.getElementById('current-symbol');
        const coinContainer = document.getElementById('coin-container');
        const searchInput = document.getElementById('search');

        let socket;
        let allSymbols = [];
        let currentSub = "";

        // 1. Fetch All Coins from HTX REST API
        async function fetchAllCoins() {
            try {
                const response = await fetch('https://api.huobi.pro/v1/common/symbols');
                const json = await response.json();
                // Filter only USDT pairs for simplicity
                allSymbols = json.data.filter(s => s['quote-currency'] === 'usdt');
                displayCoins(allSymbols);
            } catch (err) {
                coinContainer.innerText = "Error loading symbols.";
            }
        }

        // 2. Display Coins in List
        function displayCoins(coins) {
            coinContainer.innerHTML = '';
            coins.forEach(coin => {
                const div = document.createElement('div');
                div.className = 'coin-item';
                div.innerText = `${coin.base.toUpperCase()}/USDT`;
                div.onclick = () => startLivePrice(coin.symbol);
                coinContainer.appendChild(div);
            });
        }

        // 3. Search Filter
        searchInput.oninput = () => {
            const val = searchInput.value.toLowerCase();
            const filtered = allSymbols.filter(s => s.base.toLowerCase().includes(val));
            displayCoins(filtered);
        };

        // 4. WebSocket Logic
        function startLivePrice(symbol) {
            if (socket) {
                // Purana subscription unsubscribe karein ya socket close karein
                socket.close();
            }

            symbolTitle.innerText = `HTX: ${symbol.toUpperCase()}`;
            priceDisplay.innerText = "Connecting...";
            priceDisplay.className = "live-price";

            socket = new WebSocket("wss://api.huobi.pro/ws");
            let lastPrice = 0;

            socket.onopen = () => {
                const subMsg = JSON.stringify({
                    "sub": `market.${symbol}.detail`,
                    "id": "id_" + symbol
                });
                socket.send(subMsg);
            };

            socket.onmessage = (event) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const charData = pako.ungzip(new Uint8Array(reader.result), { to: 'string' });
                    const data = JSON.parse(charData);

                    if (data.ping) socket.send(JSON.stringify({ pong: data.ping }));

                    if (data.tick) {
                        const price = data.tick.close;
                        priceDisplay.innerText = `$${price < 1 ? price.toFixed(6) : price.toLocaleString()}`;
                        
                        if (price > lastPrice) priceDisplay.className = "live-price up";
                        else if (price < lastPrice) priceDisplay.className = "live-price down";
                        
                        lastPrice = price;
                    }
                };
                reader.readAsArrayBuffer(event.data);
            };
        }

        // Start
        fetchAllCoins();
    </script>
</body>
</html>
