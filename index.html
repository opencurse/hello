<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTX Elite Terminal | Institutional Grade</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --sidebar: #080808;
            --surface: #0c0c0c;
            --border: #1a1a1a;
            --text: #ffffff;
            --muted: #71717a;
            --green: #00ff9d; /* Pure Terminal Green */
            --red: #ff3b3b;   /* Pure Terminal Red */
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }

        /* Desktop Gatekeeper */
        #mobile-block {
            display: none; position: fixed; inset: 0; background: #000; z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        @media (max-width: 1100px) { #mobile-block { display: flex; } }

        /* Sidebar & Navigation */
        .panel { border-right: 1px solid var(--border); background: var(--sidebar); display: flex; flex-direction: column; }
        .markets-panel { width: 260px; }
        
        .header-box { padding: 20px; border-bottom: 1px solid var(--border); }
        .brand { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

        .search-wrap { background: #111; border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; display: flex; align-items: center; }
        .search-wrap input { background: transparent; border: none; color: white; outline: none; font-size: 12px; width: 100%; }

        .market-list { flex: 1; overflow-y: auto; }
        .market-item { 
            padding: 10px 20px; display: flex; justify-content: space-between; 
            cursor: pointer; border-bottom: 1px solid #0a0a0a; font-family: var(--font-mono); font-size: 12px;
        }
        .market-item:hover { background: #111; }

        /* Main Viewport */
        .viewport { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        
        .ticker-ribbon { 
            height: 60px; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; padding: 0 25px; gap: 40px;
        }
        .active-pair { font-size: 16px; font-weight: 700; }
        .main-price { font-family: var(--font-mono); font-size: 22px; font-weight: 700; min-width: 140px; }

        .stat-group { display: flex; flex-direction: column; }
        .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-family: var(--font-mono); font-size: 12px; margin-top: 2px; }

        .stage { flex: 1; display: flex; }
        .chart-area { flex: 3; position: relative; border-right: 1px solid var(--border); }

        /* Order Book Style */
        .orderbook { width: 300px; background: var(--sidebar); display: flex; flex-direction: column; font-family: var(--font-mono); font-size: 11px; }
        .ob-header { padding: 12px 15px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 10px; font-weight: 600; }
        .ob-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 4px 15px; position: relative; }
        .ob-list { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .ob-bar { position: absolute; right: 0; top: 0; bottom: 0; opacity: 0.15; z-index: 0; pointer-events: none; }

        /* Utility Classes */
        .up { color: var(--green); }
        .down { color: var(--red); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>
</head>
<body>

    <div id="mobile-block">
        <i data-lucide="terminal" style="margin-bottom:15px"></i>
        <p>TERMINAL RESTRICTED TO DESKTOP VIEWPORTS</p>
        <small style="color:var(--muted); margin-top:10px">Resolution > 1100px required</small>
    </div>

    <aside class="panel markets-panel">
        <div class="header-box">
            <div class="brand"><div class="dot"></div> HTX TERMINAL PRO</div>
            <div class="search-wrap">
                <input type="text" id="marketSearch" placeholder="SEARCH ASSETS...">
            </div>
        </div>
        <div id="coin-list" class="market-list"></div>
    </aside>

    <main class="viewport">
        <header class="ticker-ribbon">
            <div class="active-pair" id="cur-sym">BTC/USDT</div>
            <div class="main-price" id="cur-price">0.000000</div>
            
            <div class="stat-group">
                <span class="stat-label">Change %</span>
                <span class="stat-value" id="cur-change">0.00%</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">24h High</span>
                <span class="stat-value" id="cur-high">0.00</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">24h Low</span>
                <span class="stat-value" id="cur-low">0.00</span>
            </div>
        </header>

        <section class="stage">
            <div class="chart-area" id="chart-mount"></div>
            
            <div class="orderbook">
                <div class="ob-header">ORDER BOOK (LIVE)</div>
                <div class="ob-list" id="asks-list" style="justify-content: flex-end;"></div>
                <div style="padding: 10px 15px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-weight: 700;" id="mid-price">---</div>
                <div class="ob-list" id="bids-list"></div>
            </div>
        </section>
    </main>

    <script>
        let allPairs = [];
        let activeWs;
        let bookWs;

        const formatPrice = (val) => {
            if (!val) return "0.00";
            return Number(val).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 8 });
        };

        function renderChart(symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": `HUOBI:${symbol.toUpperCase()}`,
                "interval": "60",
                "theme": "dark",
                "style": "1",
                "container_id": "chart-mount",
                "toolbar_bg": "#000000",
                "enable_publishing": false,
                "hide_top_toolbar": true, // Removes search and clutter
                "save_image": false,
                "backgroundColor": "#000000",
                "gridColor": "#0c0c0c",
                "studies": ["MASimple@tv-basicstudies"]
            });
        }

        // Initialize Market Data
        const initWs = new WebSocket("wss://api.huobi.pro/ws");
        initWs.onopen = () => initWs.send(JSON.stringify({ "sub": "market.tickers", "id": "init" }));
        initWs.onmessage = async (e) => {
            const data = JSON.parse(pako.ungzip(await e.data.arrayBuffer(), { to: 'string' }));
            if (data.data && allPairs.length === 0) {
                // Filters both USDT and USDC
                allPairs = data.data.filter(x => x.symbol.endsWith('usdt') || x.symbol.endsWith('usdc'));
                updateList(allPairs);
                loadPair('btcusdt');
                initWs.close();
            }
        };

        function updateList(items) {
            const list = document.getElementById('coin-list');
            list.innerHTML = '';
            items.forEach(c => {
                const row = document.createElement('div');
                row.className = 'market-item';
                const base = c.symbol.replace(/usdt|usdc/, '').toUpperCase();
                const quote = c.symbol.includes('usdc') ? 'USDC' : 'USDT';
                row.innerHTML = `<span>${base}</span><span style="color:var(--muted)">${quote}</span>`;
                row.onclick = () => loadPair(c.symbol);
                list.appendChild(row);
            });
        }

        function loadPair(sym) {
            if (activeWs) activeWs.close();
            if (bookWs) bookWs.close();

            document.getElementById('cur-sym').innerText = sym.toUpperCase();
            renderChart(sym);
            
            // Connect Main Ticker
            activeWs = new WebSocket("wss://api.huobi.pro/ws");
            activeWs.onopen = () => activeWs.send(JSON.stringify({ "sub": `market.${sym}.detail`, "id": "dt" }));
            activeWs.onmessage = async (e) => {
                const res = JSON.parse(pako.ungzip(await e.data.arrayBuffer(), { to: 'string' }));
                if (res.ping) activeWs.send(JSON.stringify({ pong: res.ping }));
                if (res.tick) {
                    const t = res.tick;
                    const priceNode = document.getElementById('cur-price');
                    const oldPrice = parseFloat(priceNode.innerText.replace(/,/g, ''));
                    priceNode.innerText = formatPrice(t.close);
                    priceNode.className = t.close >= oldPrice ? 'main-price up' : 'main-price down';
                    
                    const change = ((t.close - t.open) / t.open * 100).toFixed(2);
                    document.getElementById('cur-change').innerText = `${change}%`;
                    document.getElementById('cur-change').className = `stat-value ${change >= 0 ? 'up' : 'down'}`;
                    document.getElementById('cur-high').innerText = formatPrice(t.high);
                    document.getElementById('cur-low').innerText = formatPrice(t.low);
                    document.getElementById('mid-price').innerText = formatPrice(t.close);
                }
            };

            // Connect Orderbook (Step0 = max depth precision)
            bookWs = new WebSocket("wss://api.huobi.pro/ws");
            bookWs.onopen = () => bookWs.send(JSON.stringify({ "sub": `market.${sym}.depth.step0`, "id": "ob" }));
            bookWs.onmessage = async (e) => {
                const res = JSON.parse(pako.ungzip(await e.data.arrayBuffer(), { to: 'string' }));
                if (res.tick) renderOrderBook(res.tick);
            };
        }

        function renderOrderBook(data) {
            const renderRows = (containerId, entries, colorClass) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                const maxVol = Math.max(...entries.map(e => e[1]));
                
                entries.slice(0, 15).forEach(entry => {
                    const price = entry[0];
                    const amount = entry[1];
                    const percent = (amount / maxVol * 100);
                    const row = document.createElement('div');
                    row.className = 'ob-row';
                    row.innerHTML = `
                        <span class="${colorClass}">${formatPrice(price)}</span>
                        <span>${amount.toFixed(4)}</span>
                        <div class="ob-bar" style="width:${percent}%; background:${colorClass === 'up' ? 'var(--green)' : 'var(--red)'}"></div>
                    `;
                    container.appendChild(row);
                });
            };

            renderRows('asks-list', data.asks.reverse(), 'down');
            renderRows('bids-list', data.bids, 'up');
        }

        document.getElementById('marketSearch').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            updateList(allPairs.filter(p => p.symbol.includes(val)));
        };

        lucide.createIcons();
    </script>
</body>
</html>
